<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome untuk ikon media sosial -->
  <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

  <div class="profile-card">
    <div class="card-header">
      <img src="pf.bunga.jpeg" alt="Foto Profil" class="profile-img">
    </div>
    
    <div class="card-body">
      <h2 class="name">Mikaylaa</h2>
      <p class="role">Pelajar</p>
      <p class="bio">seorang siswi kelas 10 di SMK Taruna Bhakti</p>
      
      <div class="social-links">
        <a href="#" class="social-btn"><i class="fab fa-github"></i></a>
        <a href="#" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
        <a href="#" class="social-btn"><i class="fab fa-twitter"></i></a>
        <a href="#" class="social-btn"><i class="fab fa-instagram"></i></a>
      </div>

      <div class="stats">
        <div class="stat-box">
          <h3>6</h3>
          <p>Posts</p>
        </div>
        <div class="stat-box">
          <h3>2.5k</h3>
          <p>Followers</p>
        </div>
        <div class="stat-box">
          <h3>350</h3>
          <p>Following</p>
        </div>
      </div>

      <div class="action-buttons">
        <button id="followBtn" class="btn btn-primary">Follow</button>
        <button id="msgBtn" class="btn btn-secondary">Pesan</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
